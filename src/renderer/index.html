<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline' file:; script-src 'self' 'unsafe-inline' file:; connect-src 'self' file:; webview-src *;" />
  <title>Chart Watcher</title>
  <link rel="stylesheet" href="styles/shell.css" />
  <link rel="stylesheet" href="styles/colorful.css" id="theme-link" />
</head>
<body>

<!-- ═══ TOOLBAR ═══ -->
<header id="toolbar">
  <div class="toolbar-group">
    <button id="btn-add-source" title="Add a market dashboard source">
      <span class="ico">＋</span> Source
    </button>
    <button id="btn-add-component" title="Add component to dashboard">
      <span class="ico">＋</span> Component
    </button>
    <span class="sep"></span>
    <button id="btn-toggle-mode" title="Toggle Design / View mode">
      <span id="mode-icon">✏️</span> <span id="mode-label">Design</span>
    </button>
  </div>
  <div class="toolbar-group">
    <select id="theme-select" title="Switch theme">
      <option value="colorful">🎨 Colorful</option>
      <option value="stealth">🌙 Stealth</option>
      <option value="colorblind">♿ Accessible</option>
    </select>
    <span class="sep"></span>
    <button id="btn-toggle-left" title="Toggle source panel">◧</button>
    <button id="btn-toggle-right" title="Toggle inspector">◨</button>
  </div>
</header>

<!-- ═══ MAIN ═══ -->
<div id="main">
  <!-- LEFT PANEL -->
  <aside id="left-panel">
    <section class="panel-section">
      <div class="section-header">
        <h3>Sources</h3>
        <button class="section-btn" id="btn-add-source-2" title="Add source">+</button>
      </div>
      <div id="source-list" class="item-list"></div>
    </section>
    <section class="panel-section">
      <div class="section-header">
        <h3>Library</h3>
      </div>
      <div id="component-list" class="item-list"></div>
    </section>
  </aside>

  <!-- CENTER -->
  <main id="center">
    <div id="tab-bar">
      <div id="tab-list"></div>
      <button id="btn-add-tab" title="New tab">＋</button>
    </div>
    <div id="dashboard">
      <div id="grid-overlay"></div>
      <div id="card-container"></div>
      <div id="empty-state">
        <div class="empty-icon">📊</div>
        <p>Dashboard is empty</p>
        <p class="dim">Click <b>＋ Component</b> to add a market view</p>
      </div>
    </div>
  </main>

  <!-- RIGHT PANEL -->
  <aside id="right-panel">
    <section class="panel-section">
      <div class="section-header"><h3>Inspector</h3></div>
      <div id="inspector-identity">
        <p class="dim" id="inspector-hint">Click a card to inspect</p>
      </div>
    </section>
    <section class="panel-section" id="inspector-layout-section" style="display:none">
      <div class="section-header"><h3>Grid Position</h3></div>
      <div class="form-grid">
        <label>Col</label>   <input type="number" id="inp-col" min="0" max="11" />
        <label>Row</label>   <input type="number" id="inp-row" min="0" max="7" />
        <label>Width</label>  <input type="number" id="inp-colspan" min="1" max="12" />
        <label>Height</label> <input type="number" id="inp-rowspan" min="1" max="8" />
      </div>
      <div class="form-actions">
        <button id="btn-apply-layout" class="btn-sm btn-accent">Apply</button>
        <button id="btn-configure-card" class="btn-sm">⚙ Configure</button>
        <button id="btn-delete-card" class="btn-sm btn-danger">× Remove</button>
      </div>
    </section>
  </aside>
</div>

<!-- ═══ STATUS BAR ═══ -->
<footer id="status-bar">
  <div id="status-dots"></div>
  <span class="status-sep">│</span>
  <span id="status-mutation">—</span>
  <span class="flex-spacer"></span>
  <span id="status-clock"></span>
  <span id="status-mode" class="badge">Design</span>
</footer>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<!-- HIDDEN WEBVIEW HOST -->
<div id="webview-host" style="position:fixed;width:1px;height:1px;overflow:hidden;left:-9999px;top:-9999px;"></div>

<script src="../../dist/renderer/shell.js"></script>
</body>
</html>
