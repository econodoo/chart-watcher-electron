<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' 'unsafe-inline' file:; script-src 'self' 'unsafe-inline' file:; connect-src 'self' file:; webview-src *;" />
  <title>Chart Watcher</title>
  <link rel="stylesheet" href="styles/shell.css" />
  <link rel="stylesheet" href="styles/colorful.css" id="theme-link" />
</head>
<body>

<!-- ═══ TOOLBAR ═══ -->
<header id="toolbar">
  <div class="toolbar-left">
    <button id="btn-add-source" title="Add Source">
      <span class="icon">🌐</span> Source
    </button>
    <button id="btn-add-component" title="Add Component">
      <span class="icon">📦</span> Component
    </button>
    <div class="toolbar-sep"></div>
    <button id="btn-toggle-mode" title="Toggle Design/View mode">
      <span id="mode-icon">✏️</span> <span id="mode-label">Design</span>
    </button>
  </div>

  <div class="toolbar-center">
    <span class="app-title">Chart Watcher</span>
  </div>

  <div class="toolbar-right">
    <select id="theme-select" title="Theme">
      <option value="colorful">🎨 Colorful</option>
      <option value="stealth">🌙 Stealth</option>
      <option value="colorblind">♿ ColorBlind</option>
    </select>
    <button id="btn-toggle-left" title="Toggle Explorer">☰</button>
    <button id="btn-toggle-right" title="Toggle Inspector">⚙️</button>
  </div>
</header>

<!-- ═══ MAIN CONTENT ═══ -->
<div id="main">

  <!-- LEFT PANEL: Explorer -->
  <aside id="left-panel">
    <div class="panel-section">
      <h3>Sources</h3>
      <div id="source-list" class="item-list"></div>
    </div>
    <div class="panel-section">
      <h3>Components</h3>
      <div id="component-list" class="item-list"></div>
    </div>
  </aside>

  <!-- CENTER: Dashboard -->
  <main id="center">
    <!-- Tab bar -->
    <div id="tab-bar">
      <div id="tab-list"></div>
      <button id="btn-add-tab" title="Add Tab">+</button>
    </div>

    <!-- Grid canvas -->
    <div id="dashboard">
      <div id="grid-overlay"></div>
      <div id="card-container"></div>
      <div id="empty-state">
        <p>No components placed yet.</p>
        <p>Click <strong>Component</strong> to add one.</p>
      </div>
    </div>
  </main>

  <!-- RIGHT PANEL: Inspector -->
  <aside id="right-panel">
    <div class="panel-section">
      <h3>Inspector</h3>
      <div id="inspector-content">
        <p class="dim">Select a component to inspect.</p>
      </div>
    </div>
    <div class="panel-section">
      <h3>Layout</h3>
      <div class="inspector-grid">
        <label>Row</label>  <input type="number" id="inp-row" min="0" max="7" value="0" />
        <label>Col</label>  <input type="number" id="inp-col" min="0" max="11" value="0" />
        <label>RowSpan</label> <input type="number" id="inp-rowspan" min="1" max="8" value="2" />
        <label>ColSpan</label> <input type="number" id="inp-colspan" min="1" max="12" value="3" />
      </div>
      <button id="btn-apply-layout" class="btn-small">Apply</button>
      <button id="btn-delete-card" class="btn-small btn-danger">Delete</button>
    </div>
  </aside>
</div>

<!-- ═══ STATUS BAR ═══ -->
<footer id="status-bar">
  <div id="status-dots"></div>
  <span id="status-clock"></span>
  <span id="status-mutation">—</span>
  <span id="status-mode" class="badge">Design</span>
</footer>

<!-- ═══ HIDDEN WEBVIEW HOST ═══ -->
<div id="webview-host" style="position:absolute; width:1px; height:1px; overflow:hidden; left:-9999px;"></div>

<script src="../../dist/renderer/shell.js"></script>
</body>
</html>
